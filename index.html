<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="ผู้ช่วยผู้ดำเนินเกม Werewolf — จัดการทุกคืน ทุกโหวต ทุกบทบาทจากหน้าจอเดียว" />
    <link rel="manifest" href="manifest.json" />
    <title>คืนหอนหลอนหมาป่า</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+Thai:wght@400..800&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Werewolf" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <noscript>
      <div style="padding: 28px 20px; text-align: center; font-family: sans-serif; line-height: 1.7">
        <h1 style="font-size: 20px">คืนหอนหลอนหมาป่า</h1>
        <p>แอปนี้ใช้ JavaScript ในการทำงาน — กรุณาเปิดใช้งาน JavaScript แล้วโหลดหน้านี้ใหม่</p>
      </div>
    </noscript>
    <div id="app"></div>
    <div
      id="srLive"
      aria-live="polite"
      aria-atomic="true"
      style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap"
    ></div>
    <div id="modTrig" onpointerdown="modStart(event)" onpointerup="modEnd(event)" onpointerleave="modEnd(event)" onpointercancel="modEnd(event)">
      <div class="ring"></div>
      <div class="fill"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
